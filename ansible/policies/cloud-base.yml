# cloud-base.yml
# Load policy into: data branch
# conjur policy load -b data -f cloud-base.yml

- !policy
  id: ansible
  body:
    - !group admins

    - !permit
      role: !group admins
      privileges: [ read, update, create ]
      resource: !policy ansible

    - !permit
      role: !group admins
      privileges: [ read, update, create ]
      resource: !group admins
