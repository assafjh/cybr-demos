---
- name: Onboard multiple secrets to CyberArk
  hosts: localhost
  vars:
    identity_tenant: "{{ lookup('env', 'IDENTITY_TENANT') }}"
    pcloud_tenant: "{{ lookup('env', 'PRIV_TENANT') }}"
    identity_url: "https://{{ identity_tenant }}.id.cyberark.cloud/oauth2/platformtoken"
    pcloud_url: "https://{{ pcloud_tenant }}.privilegecloud.cyberark.cloud/PasswordVault/API"
    client_id: "{{ lookup('env', 'CLIENT_ID') }}"
    client_secret: "{{ lookup('env', 'CLIENT_SECRET') }}"
    
    general_secrets:
      - name: secret1
      - name: secret2
      - name: secret3
      - name: secret4
      - name: secret5
      - name: secret6
      - name: secret7
      - name: secret8

    postgres_secret:
      username: "reception"
      address: "aws-pub-lab"
      port: "5433"
      password: "vet_123456"
      platform_id: "PostgreSQLConjur"

    safe_name: "Conjur-Kuberentes"
    safe_description: "Demo Safe for Conjur Cloud Kubernetes Integration"
    platform_id_general: "ConjurSecret"

    member_name: "{{ lookup('env', 'SAFE_OWNER') | default('', true) }}"
    
    conjur_user:
      username: "Conjur Sync"
      permissions:
        - "Use accounts"
        - "Retrieve accounts"
        - "List accounts"
        - "Access Safe without confirmation"

  tasks:
    - name: Authenticate and get JWT token
      ansible.builtin.uri:
        url: "{{ identity_url }}"
        method: POST
        headers:
          Content-Type: "application/x-www-form-urlencoded"
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ client_id }}"
          client_secret: "{{ client_secret }}"
      register: auth_response

    - name: Set JWT token
      ansible.builtin.set_fact:
        token: "{{ auth_response.json.access_token }}"
      no_log: true

    - name: Create safe
      block:
        - name: Attempt to create safe
          ansible.builtin.uri:
            url: "{{ pcloud_url }}/Safes"
            method: POST
            headers:
              Authorization: "Bearer {{ token }}"
            body_format: json
            body:
              safeName: "{{ safe_name }}"
              description: "{{ safe_description }}"
            status_code: [201, 409]
          register: create_safe_response
          failed_when: create_safe_response.status not in [201, 409]
          changed_when: create_safe_response.status == 201

      rescue:
        - name: Check if safe already exists
          ansible.builtin.debug:
            msg: "Safe already exists or another error occurred."
          when: 
            - create_safe_response.status == 409
            - "'ErrorCode' in create_safe_response.json"
            - create_safe_response.json.ErrorCode == 'SFWS0002'

    - name: Create general secrets with generated passwords
      ansible.builtin.uri:
        url: "{{ pcloud_url }}/Accounts"
        method: POST
        headers:
          Authorization: "Bearer {{ token }}"
        body_format: json
        body:
          safeName: "{{ safe_name }}"
          platformId: "{{ platform_id_general }}"
          name: "{{ item.name }}"
          secretType: "password"
          secret: "{{ lookup('ansible.builtin.password', '/dev/null length=16 chars=ascii_letters,digits') }}"
        status_code: [201, 409]
      loop: "{{ general_secrets }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create PostgreSQL secret
      ansible.builtin.uri:
        url: "{{ pcloud_url }}/Accounts"
        method: POST
        headers:
          Authorization: "Bearer {{ token }}"
        body_format: json
        body:
          safeName: "{{ safe_name }}"
          platformId: "{{ postgres_secret.platform_id }}"
          address: "{{ postgres_secret.address }}"
          userName: "{{ postgres_secret.username }}"
          secret: "{{ postgres_secret.password }}"
          secretManagement:
            automaticManagementEnabled: true
          remoteMachinesAccess:
            remoteMachines: null
            accessRestrictedToRemoteMachines: false
          platformAccountProperties:
            Port: "{{ postgres_secret.port | string }}"
            Database: "reception"
        status_code: [201, 409]

    - name: Give member full access to the safe (optional)
      ansible.builtin.uri:
        url: "{{ pcloud_url }}/Safes/{{ safe_name }}/Members"
        method: POST
        headers:
          Authorization: "Bearer {{ token }}"
        body_format: json
        body:
          memberName: "{{ member_name }}"
          memberType: "User"
          permissions:
            UseAccounts: true
            RetrieveAccounts: true
            ListAccounts: true
            AddAccounts: true
            UpdateAccountContent: true
            UpdateAccountProperties: true
            InitiateCPMAccountManagementOperations: true
            SpecifyNextAccountContent: true
            RenameAccounts: true
            DeleteAccounts: true
            UnlockAccounts: true
            ManageSafe: true
            ManageSafeMembers: true
            BackupSafe: true
            ViewAuditLog: true
            ViewSafeMembers: true
            AccessWithoutConfirmation: true
            CreateFolders: true
            DeleteFolders: true
            MoveAccountsAndFolders: true
        status_code: [201, 409]
      when: member_name | default('') | length > 0

    - name: Give Conjur sync user permissions to the safe
      ansible.builtin.uri:
        url: "{{ pcloud_url }}/Safes/{{ safe_name }}/Members"
        method: POST
        headers:
          Authorization: "Bearer {{ token }}"
        body_format: json
        body:
          memberName: "{{ conjur_user.username }}"
          memberType: "User"
          permissions:
            UseAccounts: true
            RetrieveAccounts: true
            ListAccounts: true
            AccessWithoutConfirmation: true
        status_code: [201, 409]