---
- name: Onboard multiple secrets to CyberArk
  hosts: localhost
  vars:
    identity_url: "https://assaflab.id.cyberark.cloud/oauth2/platformtoken"
    pcloud_url: "https://assaf-lab.privilegecloud.cyberark.cloud/PasswordVault/API"
    client_id: "{{ lookup('env', 'CLIENT_ID') }}"
    client_secret: "{{ lookup('env', 'CLIENT_SECRET') }}"

    # Intro demo safes (reflect allow/deny story)
    safe1_name: "IntroDemo-WebApp-Safe"
    safe1_description: "Intro demo: web app allowed secret"
    safe2_name: "IntroDemo-Payments-Safe"
    safe2_description: "Intro demo: web app NOT allowed secret (deny)"

    # Only the two secrets we need for the demo, each mapped to its safe
    general_secrets:
      - name: "webapp-db-password"          # secret1 -> safe1
        safe: "{{ safe1_name }}"
      - name: "payments-admin-password"    # secret2 -> safe2
        safe: "{{ safe2_name }}"

    platform_id_general: "ConjurSecret"
    give_full_access: true  # Set to true to give a member full access to the safe
    member_name: "assaf@assaflab"
    conjur_user:
      username: "Conjur Sync"
      permissions: ["Use accounts", "Retrieve accounts", "List accounts", "Access Safe without confirmation"]
    token: ""

  tasks:
    - name: Authenticate and get JWT token
      ansible.builtin.uri:
        url: "{{ identity_url }}"
        method: POST
        headers:
          Content-Type: "application/x-www-form-urlencoded"
        body: "grant_type=client_credentials&client_id={{ client_id }}&client_secret={{ client_secret }}"
        return_content: true
      register: auth_response

    - name: Set JWT token
      ansible.builtin.set_fact:
        token: "{{ auth_response.json.access_token }}"
      

    # --- Create safe1 ---
    - name: Set safe vars to safe1
      ansible.builtin.set_fact:
        safe_name: "{{ safe1_name }}"
        safe_description: "{{ safe1_description }}"

    - name: Create safe (safe1)
      block:
        - name: Attempt to create safe
          ansible.builtin.uri:
            url: "{{ pcloud_url }}/Safes"
            method: POST
            headers:
              Authorization: "Bearer {{ token }}"
              Content-Type: "application/json"
            body_format: json
            body: >
              {
                "safeName": "{{ safe_name }}",
                "description": "{{ safe_description }}"
              }
            status_code: [201, 409]
          register: create_safe_response
          failed_when: create_safe_response.status not in [201, 409]
          changed_when: create_safe_response.status == 201

      rescue:
        - name: Check if safe already exists
          ansible.builtin.debug:
            msg: "Safe already exists or another error occurred."
          when: create_safe_response.status == 409 and 'ErrorCode' in create_safe_response.json and create_safe_response.json.ErrorCode == 'SFWS0002'

    # --- Create safe2 ---
    - name: Set safe vars to safe2
      ansible.builtin.set_fact:
        safe_name: "{{ safe2_name }}"
        safe_description: "{{ safe2_description }}"

    - name: Create safe (safe2)
      block:
        - name: Attempt to create safe
          ansible.builtin.uri:
            url: "{{ pcloud_url }}/Safes"
            method: POST
            headers:
              Authorization: "Bearer {{ token }}"
              Content-Type: "application/json"
            body_format: json
            body: >
              {
                "safeName": "{{ safe_name }}",
                "description": "{{ safe_description }}"
              }
            status_code: [201, 409]
          register: create_safe_response
          failed_when: create_safe_response.status not in [201, 409]
          changed_when: create_safe_response.status == 201

      rescue:
        - name: Check if safe already exists
          ansible.builtin.debug:
            msg: "Safe already exists or another error occurred."
          when: create_safe_response.status == 409 and 'ErrorCode' in create_safe_response.json and create_safe_response.json.ErrorCode == 'SFWS0002'

    - name: Generate random passwords for general secrets
      ansible.builtin.set_fact:
        general_secrets_with_passwords: []

    - name: Add random password to each secret
      ansible.builtin.set_fact:
        general_secrets_with_passwords: >-
          {{
            general_secrets_with_passwords + [
              item | combine({'password': lookup('password', '/dev/null length=20 chars=ascii_letters,digits')})
            ]
          }}
      loop: "{{ general_secrets }}"

    - name: Debug general secrets with passwords
      ansible.builtin.debug:
        var: general_secrets_with_passwords

    - name: Create general secrets (each one to its own safe)
      ansible.builtin.uri:
        url: "{{ pcloud_url }}/Accounts"
        method: POST
        headers:
          Authorization: "Bearer {{ token }}"
          Content-Type: "application/json"
        body_format: json
        body: >
          {
            "safeName": "{{ item.safe }}",
            "platformId": "{{ platform_id_general }}",
            "name": "{{ item.name }}",
            "secretType": "password",
            "secret": "{{ item.password }}"
          }
        status_code: [201, 409]
      loop: "{{ general_secrets_with_passwords }}"
      loop_control:
        loop_var: item
      register: create_account_response
      failed_when: create_account_response.status not in [201, 409]
      changed_when: create_account_response.status == 201
      

    - name: Give member full access to the safe (optional)
      ansible.builtin.uri:
        url: "{{ pcloud_url }}/Safes/{{ safe_name }}/Members"
        method: POST
        headers:
          Authorization: "Bearer {{ token }}"
          Content-Type: "application/json"
        body_format: json
        body: >
          {
            "memberName": "{{ member_name }}",
            "memberType": "User",
            "permissions": {
                "UseAccounts": true,
                "RetrieveAccounts": true,
                "ListAccounts": true,
                "AddAccounts": true,
                "UpdateAccountContent": true,
                "UpdateAccountProperties": true,
                "InitiateCPMAccountManagementOperations": true,
                "SpecifyNextAccountContent": true,
                "RenameAccounts": true,
                "DeleteAccounts": true,
                "UnlockAccounts": true,
                "ManageSafe": true,
                "ManageSafeMembers": true,
                "BackupSafe": true,
                "ViewAuditLog": true,
                "ViewSafeMembers": true,
                "AccessWithoutConfirmation": true,
                "CreateFolders": true,
                "DeleteFolders": true,
                "MoveAccountsAndFolders": true
              }
          }
        status_code: [201, 409]
      register: member_full_access_response
      failed_when: member_full_access_response.status not in [201, 409]
      changed_when: member_full_access_response.status == 201
      when: give_full_access

    - name: Set safe_name to safe1 for member full access
      ansible.builtin.set_fact:
        safe_name: "{{ safe1_name }}"

    - name: Give member full access to the safe (safe1) (optional)
      ansible.builtin.uri:
        url: "{{ pcloud_url }}/Safes/{{ safe_name }}/Members"
        method: POST
        headers:
          Authorization: "Bearer {{ token }}"
          Content-Type: "application/json"
        body_format: json
        body: >
          {
            "memberName": "{{ member_name }}",
            "memberType": "User",
            "permissions": {
                "UseAccounts": true,
                "RetrieveAccounts": true,
                "ListAccounts": true,
                "AddAccounts": true,
                "UpdateAccountContent": true,
                "UpdateAccountProperties": true,
                "InitiateCPMAccountManagementOperations": true,
                "SpecifyNextAccountContent": true,
                "RenameAccounts": true,
                "DeleteAccounts": true,
                "UnlockAccounts": true,
                "ManageSafe": true,
                "ManageSafeMembers": true,
                "BackupSafe": true,
                "ViewAuditLog": true,
                "ViewSafeMembers": true,
                "AccessWithoutConfirmation": true,
                "CreateFolders": true,
                "DeleteFolders": true,
                "MoveAccountsAndFolders": true
              }
          }
        status_code: [201, 409]
      register: full_access_response
      failed_when: full_access_response.status not in [201, 409]
      changed_when: full_access_response.status == 201
      when: give_full_access


    - name: Set safe_name to safe2 for member full access
      ansible.builtin.set_fact:
        safe_name: "{{ safe2_name }}"

    - name: Give member full access to the safe (safe2) (optional)
      ansible.builtin.uri:
        url: "{{ pcloud_url }}/Safes/{{ safe_name }}/Members"
        method: POST
        headers:
          Authorization: "Bearer {{ token }}"
          Content-Type: "application/json"
        body_format: json
        body: >
          {
            "memberName": "{{ member_name }}",
            "memberType": "User",
            "permissions": {
                "UseAccounts": true,
                "RetrieveAccounts": true,
                "ListAccounts": true,
                "AddAccounts": true,
                "UpdateAccountContent": true,
                "UpdateAccountProperties": true,
                "InitiateCPMAccountManagementOperations": true,
                "SpecifyNextAccountContent": true,
                "RenameAccounts": true,
                "DeleteAccounts": true,
                "UnlockAccounts": true,
                "ManageSafe": true,
                "ManageSafeMembers": true,
                "BackupSafe": true,
                "ViewAuditLog": true,
                "ViewSafeMembers": true,
                "AccessWithoutConfirmation": true,
                "CreateFolders": true,
                "DeleteFolders": true,
                "MoveAccountsAndFolders": true
              }
          }
        status_code: [201, 409]
      register: full_access_response
      failed_when: full_access_response.status not in [201, 409]
      changed_when: full_access_response.status == 201
      when: give_full_access


    # Conjur Sync permissions on BOTH safes
    - name: Set safe_name to safe1 for Conjur Sync permissions
      ansible.builtin.set_fact:
        safe_name: "{{ safe1_name }}"

    - name: Give Conjur sync user permissions to the safe (safe1)
      ansible.builtin.uri:
        url: "{{ pcloud_url }}/Safes/{{ safe_name }}/Members"
        method: POST
        headers:
          Authorization: "Bearer {{ token }}"
          Content-Type: "application/json"
        body_format: json
        body: >
          {
            "memberName": "{{ conjur_user.username }}",
            "memberType": "User",
            "permissions": {
                "UseAccounts": true,
                "RetrieveAccounts": true,
                "ListAccounts": true,
                "AccessWithoutConfirmation": true,
              }
          }
        status_code: [201, 409]
      register: conjur_sync_member_response
      failed_when: conjur_sync_member_response.status not in [201, 409]
      changed_when: conjur_sync_member_response.status == 201

    - name: Debug Conjur Sync add-member result (safe1)
      ansible.builtin.debug:
        msg: "Conjur Sync member add status={{ conjur_sync_member_response.status }} body={{ conjur_sync_member_response.json | default({}) }}"


    - name: Set safe_name to safe2 for Conjur Sync permissions
      ansible.builtin.set_fact:
        safe_name: "{{ safe2_name }}"

    - name: Give Conjur sync user permissions to the safe (safe2)
      ansible.builtin.uri:
        url: "{{ pcloud_url }}/Safes/{{ safe_name }}/Members"
        method: POST
        headers:
          Authorization: "Bearer {{ token }}"
          Content-Type: "application/json"
        body_format: json
        body: >
          {
            "memberName": "{{ conjur_user.username }}",
            "memberType": "User",
            "permissions": {
                "UseAccounts": true,
                "RetrieveAccounts": true,
                "ListAccounts": true,
                "AccessWithoutConfirmation": true,
              }
          }
        status_code: [201, 409]
      register: conjur_sync_member_response
      failed_when: conjur_sync_member_response.status not in [201, 409]
      changed_when: conjur_sync_member_response.status == 201

    - name: Debug Conjur Sync add-member result (safe2)
      ansible.builtin.debug:
        msg: "Conjur Sync member add status={{ conjur_sync_member_response.status }} body={{ conjur_sync_member_response.json | default({}) }}"

