# Settings for the Linux CP scripts (1-preflight.sh, 4-test-server.sh) - on the CP machine.
# Copy to settings.conf next to the scripts and fill in the <...> values. One KEY=VALUE per line, no quotes.
# settings.conf is git-ignored. It is read as data, never executed.

# Host name only - no https://, no path. Privilege Cloud: vault-<subdomain>.privilegecloud.cyberark.cloud
VAULT_ADDRESS=<vault-address>
VAULT_PORT=1858

# Optional - the Provider user createenv creates in the Vault. Default: Prov_<short host name>.
# At most 28 characters - the installer fails on longer names (e.g. a full AWS host name).
# PROVIDER_USER=Prov_myhost_CP

# Optional - the OS user 4-test-server.sh retrieves as, like the application would.
# Default: the user who ran sudo.
# APP_OS_USER=tomcat
