---
# INJECT_SCOPE=labeled (default): only namespaces labeled conjur.org/injection=enabled
# are sent to the webhook; inside them pods still opt in with conjur.org/inject: "true".
# $CA_BUNDLE and $FAILURE_POLICY are replaced by scripts/01-deploy-injector.sh
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: conjur-injector
webhooks:
- name: inject.conjur.org
  admissionReviewVersions: ["v1"]
  sideEffects: None
  timeoutSeconds: 5
  failurePolicy: $FAILURE_POLICY
  namespaceSelector:
    matchLabels:
      conjur.org/injection: enabled
  rules:
  - operations: ["CREATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
    scope: Namespaced
  clientConfig:
    service:
      name: conjur-injector
      namespace: conjur-injector
      path: /mutate
      port: 443
    caBundle: $CA_BUNDLE
