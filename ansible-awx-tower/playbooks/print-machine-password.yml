---
- name: Demo - Machine Credential Injection via Conjur
  hosts: localhost
  gather_facts: false

  tasks:
    - name: "⚠️ SECURITY NOTICE"
      ansible.builtin.debug:
        msg: |
          This playbook demonstrates how AWX securely injects 'ansible_password'
          from Conjur directly into the execution environment.
          In production, always use 'no_log: true' for sensitive tasks.

    - name: Show injected machine password (DEMO ONLY)
      ansible.builtin.debug:
        msg: "Successfully retrieved machine password. Value: '{{ ansible_password }}'"

    - name: Simulate an administrative action with the password
      ansible.builtin.command: "echo 'Authenticating with the injected password...'"
      environment:
        MOCK_PASS: "{{ ansible_password }}"
      no_log: true
      changed_when: false