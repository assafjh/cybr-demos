---
- name: Demo - Application Secrets Injection via Conjur
  hosts: localhost
  gather_facts: false

  vars:
    # Aggregating the injected variables into a dictionary for clean looping.
    # We use 'default' to prevent the playbook from crashing if a variable is missing.
    demo_secrets:
      db_pass: "{{ db_password | default('NOT_SET') }}"
      api_key: "{{ api_key | default('NOT_SET') }}"
      ssh_key: "{{ ssh_key | default('NOT_SET') }}"

  tasks:
    - name: "⚠️ SECURITY NOTICE"
      ansible.builtin.debug:
        msg: |
          This playbook demonstrates dynamic variable injection via the custom
          AWX Conjur Credential Type.

    # DRY Principle: One task, looping over all secrets
    - name: Display injected variables (DEMO ONLY - Remove in production)
      ansible.builtin.debug:
        msg: "Secret for '{{ item.key }}' successfully injected. Value: '{{ item.value }}'"
      loop: "{{ demo_secrets | dict2items }}"

    - name: Simulate configuring an application with the secrets
      ansible.builtin.command: "echo 'Applying configuration for {{ item.key }}...'"
      environment:
        SECRET_VALUE: "{{ item.value }}"
      no_log: true
      changed_when: false
      loop: "{{ demo_secrets | dict2items }}"