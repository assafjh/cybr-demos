apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: awx-admin-password
    type: Opaque
    # Security Best Practice: Never hardcode passwords in public repositories.
    # The actual password is kept locally in a git-ignored .env file.
    envs:
      - awx-secret.env

resources:
  # Note: Ensure this operator version matches your cluster compatibility
  - github.com/ansible/awx-operator/config/default?ref=1.1.3
  - pv.yml
  - pvc.yml
  - awx.yml

images:
  - name: quay.io/ansible/awx-operator
    newTag: 1.1.3

namespace: awx