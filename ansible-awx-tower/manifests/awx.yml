---
apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: awx
  namespace: awx
spec:
  replicas: 1
  ingress_type: ingress
  hostname: $HOSTNAME
  ingress_path: /ansible-awx
  ingress_path_type: Prefix
  
  admin_user: admin
  admin_email: admin@demo.local
  admin_password_secret: awx-admin-password

  projects_persistence: true
  projects_existing_claim: awx-projects-claim

  # 🚀 THE "LEAN DEMO" MAGIC: Capping resources to prevent the node from crashing
  web_resource_requirements:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  task_resource_requirements:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  ee_resource_requirements:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  postgres_resource_requirements:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi