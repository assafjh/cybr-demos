# Settings for the Conjur Enterprise demo deploy scripts.
# Any value can be overridden from the environment: CONTAINER_MGR=podman ./01-deploy-container.sh

#==== Container (keep in sync with upgrade-conjur-enterprise-version/scripts/upgrade.properties) ====
SUDO="${SUDO:-}"                                                   # "sudo" if docker/podman needs it
CONTAINER_MGR="${CONTAINER_MGR:-docker}"                           # docker | podman
CONTAINER_IMG="${CONTAINER_IMG:-aws-pub-lab:5443/conjur-appliance}" # repository, without tag
CONTAINER_NAME="${CONTAINER_NAME:-conjur}"                         # containers are named <name>-<tag>
CONTAINER_VOLUME_PATH="${CONTAINER_VOLUME_PATH:-$HOME/conjur}"     # volumes go to <path>/<name>-<tag>

#==== Conjur ====
CONJUR_ACCOUNT="${CONJUR_ACCOUNT:-conjur}"
CONJUR_ADMIN_PASSWORD="${CONJUR_ADMIN_PASSWORD:-}"                 # empty = prompt (don't commit it)
# Name clients use to reach Conjur
CONJUR_HOSTNAME="${CONJUR_HOSTNAME:-$(hostname -f)}"
# Extra certificate names, comma separated. This host's FQDN/short name and localhost
# are added automatically. Restore keeps these forever, so list every name you'll ever use now.
LEADER_ALTNAMES="${LEADER_ALTNAMES:-}"
