spring.application.name=springboot-hot-reload

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=reporting_service_ro
spring.datasource.password=reporting123

# Conjur push-to-file sidecar writes credentials here in Kubernetes.
# In local dev this file is absent; the defaults above are used instead.
spring.config.import=optional:file:/etc/conjur/secrets/db-credentials.properties

management.endpoints.web.exposure.include=health,info,refresh
management.endpoint.health.show-details=always

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

secrets.watch-dir=/etc/conjur/secrets

# Allows the app to start before the DB is reachable (important in K8s where
# the sidecar may not have injected credentials yet); readiness probe gates traffic.
spring.datasource.hikari.initialization-fail-timeout=0
# Connections are validated on borrow and recycled so stale ones don't linger after a refresh.
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.keepalive-time=30000
