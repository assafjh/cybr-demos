services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/postgres
    volumes:
      - ./local-secrets:/etc/conjur/secrets:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: ghcr.io/assafjh/postgres-companydb:17-alpine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
