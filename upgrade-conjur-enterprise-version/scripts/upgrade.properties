# Settings for the Conjur Enterprise demo upgrade scripts.
# Any value can be overridden from the environment: CONTAINER_MGR=podman ./scripts/02-deploy-new-version.sh 13.10.0

SUDO="${SUDO:-}"                                                   # "sudo" if docker/podman needs it
CONTAINER_MGR="${CONTAINER_MGR:-docker}"                           # docker | podman
CONTAINER_IMG="${CONTAINER_IMG:-aws-pub-lab:5443/conjur-appliance}" # repository, without tag
CONTAINER_NAME="${CONTAINER_NAME:-conjur}"                         # containers are named <name>-<tag>
CONTAINER_VOLUME_PATH="${CONTAINER_VOLUME_PATH:-$HOME/conjur}"     # volumes go to <path>/<name>-<tag>
ENABLE_NGINX_BYPASS="${ENABLE_NGINX_BYPASS:-true}"                 # see 03-restore-backup.sh
