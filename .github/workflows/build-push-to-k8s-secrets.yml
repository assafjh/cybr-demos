name: CI - Build & Push K8s Secrets App

on:
  push:
    paths:
      - 'images/push-to-k8s-secrets/**'
      - '!**/*.md'
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/push-to-k8s-secrets

jobs:
  build-test-push:
    name: Build, Test & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build local image for testing
        uses: docker/build-push-action@v6
        with:
          context: images/push-to-k8s-secrets
          load: true
          tags: k8s-test:latest
          cache-from: type=gha

      - name: Smoke Test (Verify ENV Output)
        run: |
          echo "--- Running Container with Mock Secret ---"
          OUTPUT=$(docker run --name k8s-test-run -e MY_DUMMY_SECRET=CyberArk123 k8s-test:latest & sleep 2 && docker logs k8s-test-run && docker rm -f k8s-test-run)
          
          if echo "$OUTPUT" | grep -q "MY_DUMMY_SECRET=CyberArk123"; then
            echo "✅ Smoke Test Passed: Secret detected in environment output!"
          else
            echo "❌ Smoke Test Failed: Secret not found in logs."
            echo "Full Output:"
            echo "$OUTPUT"
            exit 1
          fi

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: images/push-to-k8s-secrets
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max