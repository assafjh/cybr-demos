name: CI - Build & Push K8s Secrets App

on:
  push:
    paths:
      - 'images/push-to-k8s-secrets/**'
      - '!**/*.md'
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/push-to-k8s-secrets

jobs:
  build-test-push:
    name: Build, Test & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build local image for testing
        uses: docker/build-push-action@v6
        with:
          context: images/push-to-k8s-secrets
          load: true
          tags: k8s-test:latest
          cache-from: type=gha

      - name: Smoke Test (Verify ENV Output)
        run: |
          echo "--- Starting Container with Mock Secret ---"
          # Run container in detached mode and capture ID
          CONTAINER_ID=$(docker run -d -e MY_DUMMY_SECRET=CyberArk123 k8s-test:latest)
          
          # Allow time for entry-point script execution
          sleep 3
          
          # Capture logs for verification
          LOGS=$(docker logs $CONTAINER_ID)
          echo "Container Logs Output:"
          echo "----------------------"
          echo "$LOGS"
          echo "----------------------"
          
          # Validation 1: Check if the injected secret exists in the logs
          if echo "$LOGS" | grep -q "MY_DUMMY_SECRET=CyberArk123"; then
            echo "SUCCESS: Secret detected in environment output!"
          else
            echo "ERROR: Secret not found in logs."
            docker rm -f $CONTAINER_ID
            exit 1
          fi
          
          # Validation 2: Check if script internal headers are present
          if echo "$LOGS" | grep -q "env | grep SECRET output:"; then
            echo "SUCCESS: Script internal logic executed correctly."
          else
            echo "ERROR: Script output is missing expected headers."
            docker rm -f $CONTAINER_ID
            exit 1
          fi
          
          # Cleanup testing container
          docker rm -f $CONTAINER_ID

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: images/push-to-k8s-secrets
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max