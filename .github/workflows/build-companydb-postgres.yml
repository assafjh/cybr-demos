name: CI - Build & Push Postgres (companydb) mTLS Image

on:
  push:
    paths:
      - 'images/postgres-companydb/**'
      - '!**/*.md'
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/postgres-companydb

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: images/postgres-companydb/Dockerfile

  build-test-push:
    name: Build, Test & Push
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate mTLS Certificates
        run: |
          cd images/postgres-companydb
          
          mkdir -p certs
          
          export SCRIPT_DIR="$(pwd)"
          export CERT_DIR="$(pwd)/certs"
          
          source .env
          
          chmod +x tools/*.sh
          BYPASS_ROOT_CA_CN="$ROOT_CA_CN" ./tools/01-create-root-ca.sh
          BYPASS_SERVER_CN="$POSTGRES_CN" BYPASS_SERVER_KEY_FILE_PATH="$POSTGRES_KEY_FILE_PATH" ./tools/02-create-self-signed-certificate.sh
          BYPASS_SERVER_KEY_FILE_PATH="$POSTGRES_KEY_FILE_PATH" BYPASS_SUBJECT_ALT_NAMES="$POSTGRES_SUBJECT_ALT_NAMES" ./tools/03-generate-csr.sh
          BYPASS_CA_CERTIFICATE_FILE_PATH="$ROOT_CA_CERTIFICATE_PATH" BYPASS_CA_KEY_FILE_PATH="$ROOT_CA_KEY_PATH" BYPASS_SERVER_CERTIFICATE_FILE_PATH="$POSTGRES_CERTIFICATE_FILE_PATH" ./tools/04-sign-csr.sh
          
          echo "--- Verifying files exist in the Docker Context ---"
          ls -la certs/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=17-alpine
            type=sha,format=short

      - name: Build local image for testing
        uses: docker/build-push-action@v6
        with:
          context: images/postgres-companydb
          load: true
          tags: postgres-test:latest
          cache-from: type=gha

      - name: Smoke Test (Health & Data)
        run: |
          docker run -d --name pg-test \
            -e POSTGRES_PASSWORD=testpass \
            -p 5432:5432 \
            postgres-test:latest
          
          # Wait for Postgres
          TIMEOUT=10
          until docker exec pg-test pg_isready -U admin || [ $TIMEOUT -eq 0 ]; do
            sleep 3
            ((TIMEOUT--))
          done

          # 1. Check Connectivity & SSL (Forced TCP connection via -h 127.0.0.1)
          echo "Checking SSL..."
          docker exec -e PGPASSWORD=testpass pg-test psql -h 127.0.0.1 -t -U admin -d postgres -c "SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid();" | grep -q "t"

          # 2. Check Data Integrity (Functional Test)
          # SQL script verified: customers, orders, and support_tickets tables are present.
          echo "Checking Data..."
          CUSTOMER_COUNT=$(docker exec -e PGPASSWORD=testpass pg-test psql -t -U admin -d postgres -c "SELECT count(*) FROM customers;" | xargs)
          
          # We check if the result is a number and greater than or equal to 0 
          # (Since your demo-db.sql creates the table but might not insert rows yet, checking for >= 0 or just checking if the table exists is safer)
          if [[ "$CUSTOMER_COUNT" =~ ^[0-9]+$ ]]; then
            echo "✅ Data verified: 'customers' table exists and contains $CUSTOMER_COUNT rows."
          else
            echo "❌ Functional Test Failed: 'customers' table not found or error occurred."
            exit 1
          fi
          
          docker rm -f pg-test

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: images/postgres-companydb
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max