name: CI - Build & Push Postgres mTLS Image

on:
  push:
    paths:
      - 'images/postgres/**'
      - '!**/*.md'
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/postgres-companydb

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: images/postgres/Dockerfile

  build-test-push:
    name: Build, Test & Push
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate mTLS Certificates
        run: |
          cd images/postgres
          chmod +x tools/*.sh
          
          export ROOT_CA_CN="Demo Root CA"
          export POSTGRES_CN="localhost"
          export POSTGRES_KEY_FILE_PATH="./certs/postgresdb.key"
          export ROOT_CA_CERTIFICATE_PATH="./certs/rootCA.pem"
          export ROOT_CA_KEY_PATH="./certs/rootCA.key"
          export POSTGRES_CERTIFICATE_FILE_PATH="./certs/postgresdb.pem"
          export POSTGRES_SUBJECT_ALT_NAMES="DNS:localhost,IP:127.0.0.1"
          
          mkdir -p certs
          ./tools/01-create-root-ca.sh
          ./tools/02-create-self-signed-certificate.sh
          ./tools/03-generate-csr.sh
          ./tools/04-sign-csr.sh
          
          ls -l certs/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=17-alpine
            type=sha,format=short

      - name: Build local image for testing
        uses: docker/build-push-action@v6
        with:
          context: images/postgres
          load: true
          tags: postgres-test:latest
          cache-from: type=gha

      - name: Smoke Test (Health & Data)
        run: |
          docker run -d --name pg-test \
            -e POSTGRES_PASSWORD=testpass \
            -p 5432:5432 \
            postgres-test:latest
          
          # Wait for Postgres
          TIMEOUT=10
          until docker exec pg-test pg_isready -U admin || [ $TIMEOUT -eq 0 ]; do
            sleep 3
            ((TIMEOUT--))
          done

          # 1. Check Connectivity & SSL
          echo "Checking SSL..."
          docker exec pg-test psql -U admin -d postgres -c "SELECT ssl_is_used();" | grep -q "t"

          # 2. Check Data Integrity (Functional Test)
          echo "Checking Data..."
          CUSTOMER_COUNT=$(docker exec pg-test psql -t -U admin -d postgres -c "SELECT count(*) FROM customers;" | xargs)
          
          if [ "$CUSTOMER_COUNT" -gt 0 ]; then
            echo "✅ Data verified: $CUSTOMER_COUNT customers found."
          else
            echo "❌ Functional Test Failed: No data in 'customers' table."
            exit 1
          fi
          
          docker rm -f pg-test

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: images/postgres
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max