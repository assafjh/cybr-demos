name: Reusable Docker Build & Push

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Name of the image to build and push'
        required: true
        type: string
      context_path:
        description: 'Path to the docker context'
        required: true
        type: string
      smoke_test_command:
        description: 'Command to run against the local image for smoke testing'
        required: false
        type: string
        default: ''
      pre_build_command:
        description: 'Command to run before building the image (e.g., generating certs)'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Target platforms for the push step'
        required: false
        type: string
        default: 'linux/amd64'
      image_tags:
        description: 'Tags metadata generation config'
        required: false
        type: string
        default: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-lint-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ inputs.context_path }}/Dockerfile
          failure-threshold: warning
          ignore: DL3007,DL3018

      - name: Run pre-build command
        if: ${{ inputs.pre_build_command != '' }}
        run: |
          echo "Running pre-build command..."
          ${{ inputs.pre_build_command }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context_path }}
          load: true
          tags: local-smoke-${{ inputs.image_name }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        if: ${{ inputs.smoke_test_command != '' }}
        run: |
          echo "Running smoke test for ${{ inputs.image_name }}..."
          ${{ inputs.smoke_test_command }}

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ inputs.image_name }}
          tags: ${{ inputs.image_tags }}

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context_path }}
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max