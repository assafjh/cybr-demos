name: ASCP Demo - Build & Release

on:
  push:
    paths:
      - 'application-server-credential-provider/**'
  workflow_dispatch: # הפעלה ידנית

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # נדרש כדי ליצור/לערוך Release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build WAR with Maven
        working-directory: application-server-credential-provider/code/demo-app
        # בנייה נקייה ללא הרצת טסטים כדי להאיץ את התהליך[cite: 1, 2]
        run: mvn clean package -DskipTests 

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Latest ASCP Demo Build"
          body: "This release contains the most recent stable build of the ASCP Demo app."
          files: application-server-credential-provider/code/demo-app/target/*.war
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}