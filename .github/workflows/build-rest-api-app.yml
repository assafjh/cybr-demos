name: CI - Build & Push REST API App

on:
  push:
    paths:
      - 'images/rest-api-app/**'
      - '!**/*.md'
    branches: [ "main", "master" ]
  pull_request:
    paths:
      - 'images/rest-api-app/**'
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rest-api-app

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Lint with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: images/rest-api-app/Dockerfile
          ignore: DL3007,DL3018

  build-test-push:
    name: Build, Test & Push
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build local image for testing
        uses: docker/build-push-action@v6
        with:
          context: images/rest-api-app
          load: true
          tags: rest-api-test:latest
          cache-from: type=gha

      - name: Smoke Test (Pre-authenticated mode)
        run: |
          echo "--- Test 1: Pre-authenticated mode (mock sidecar token) ---"

          # Create a temp dir to simulate the sidecar-injected token volume
          MOCK_TOKEN_DIR=$(mktemp -d)
          echo '{"protected":"...","payload":"...","signature":"..."}' > "$MOCK_TOKEN_DIR/access-token"

          # Run the container with the mock token mounted + required env vars
          docker run -d --name app-pre-auth \
            -v "$MOCK_TOKEN_DIR:/run/conjur:ro" \
            -e AUTH_MODE=pre-authenticated \
            -e CONJUR_APPLIANCE_URL=http://localhost:8080 \
            -e CONJUR_ACCOUNT=conjur \
            -e CONJUR_VARIABLE_PATH=data/test/secret1 \
            rest-api-test:latest

          sleep 3

          LOGS=$(docker logs app-pre-auth 2>&1)
          echo "$LOGS"

          # Verify pre-authenticated mode was selected
          if echo "$LOGS" | grep -q "pre-authenticated"; then
            echo "✅ Pre-authenticated mode: correct mode detected."
          else
            echo "❌ Pre-authenticated mode: wrong mode or script didn't start."
            docker rm -f app-pre-auth
            exit 1
          fi

          # Verify it tried to read the token (curl will fail since there's no real Conjur, but that's OK)
          if echo "$LOGS" | grep -q "access-token"; then
            echo "✅ Pre-authenticated mode: token file was found."
          else
            echo "❌ Pre-authenticated mode: token file not found."
            docker rm -f app-pre-auth
            exit 1
          fi

          docker rm -f app-pre-auth
          rm -rf "$MOCK_TOKEN_DIR"

      - name: Smoke Test (Self-authenticated mode)
        run: |
          echo "--- Test 2: Self-authenticated mode (mock JWT) ---"

          # Create a temp dir to simulate the K8s service-account token
          MOCK_SA_DIR=$(mktemp -d)
          echo 'eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.mock.token' > "$MOCK_SA_DIR/token"

          docker run -d --name app-self-auth \
            -v "$MOCK_SA_DIR:/var/run/secrets/kubernetes.io/serviceaccount:ro" \
            -e AUTH_MODE=self-authenticated \
            -e CONJUR_APPLIANCE_URL=http://localhost:8080 \
            -e CONJUR_ACCOUNT=conjur \
            -e CONJUR_VARIABLE_PATH=data/test/secret1 \
            -e CONJUR_AUTHN_URL=http://localhost:8080/authn-jwt/k8s \
            rest-api-test:latest

          sleep 3

          LOGS=$(docker logs app-self-auth 2>&1)
          echo "$LOGS"

          # Verify self-authenticated mode was selected
          if echo "$LOGS" | grep -q "self-authenticated"; then
            echo "✅ Self-authenticated mode: correct mode detected."
          else
            echo "❌ Self-authenticated mode: wrong mode or script didn't start."
            docker rm -f app-self-auth
            exit 1
          fi

          # Verify it found the JWT file
          if echo "$LOGS" | grep -q "token"; then
            echo "✅ Self-authenticated mode: JWT file was found."
          else
            echo "❌ Self-authenticated mode: JWT file not found."
            docker rm -f app-self-auth
            exit 1
          fi

          docker rm -f app-self-auth
          rm -rf "$MOCK_SA_DIR"

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: images/rest-api-app
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
