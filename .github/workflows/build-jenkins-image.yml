name: CI - Build & Push Jenkins Image

on:
  push:
    paths:
      - 'images/jenkins/**'
      - '!**/*.md'
    branches: [ "main", "master" ]
  pull_request:
    paths:
      - 'images/jenkins/**'
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jenkins-demo

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: images/jenkins/Dockerfile

  build-test-push:
    name: Build, Test & Push
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build local image for testing
        uses: docker/build-push-action@v6
        with:
          context: images/jenkins
          load: true
          tags: jenkins-test:latest
          cache-from: type=gha

      - name: Smoke Test (Health Check)
        run: |
          docker run -d --name jenkins-test -p 8080:8080 jenkins-test:latest
          
          echo "Waiting for Jenkins to be ready..."
          # Checking every 5 seconds up to 60 seconds
          TIMEOUT=12
          while [ $TIMEOUT -gt 0 ]; do
            if curl -sI http://localhost:8080/login | grep -q "200 OK"; then
              echo "✅ Jenkins is up and responding!"
              break
            fi
            echo "Waiting... ($TIMEOUT)"
            sleep 5
            TIMEOUT=$((TIMEOUT-1))
          done

          if [ $TIMEOUT -eq 0 ]; then
            echo "❌ Smoke Test Failed: Jenkins didn't respond in time."
            docker logs jenkins-test
            exit 1
          fi
          
          docker rm -f jenkins-test

      - name: Build and push final image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: images/jenkins
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max