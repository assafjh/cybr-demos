name: CI - Build & Push Jenkins Image

on:
  push:
    paths:
      - 'images/jenkins/**'
    branches: [ "main", "master" ]
  pull_request:
    paths:
      - 'images/jenkins/**'
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # This will result in ghcr.io/assafjh/jenkins-demo
  IMAGE_NAME: ${{ github.repository_owner }}/jenkins-demo

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: images/jenkins/Dockerfile

  build-and-push:
    name: Build & Push Docker Image
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=sha

      - name: Build image for testing (Local)
        uses: docker/build-push-action@v6
        with:
          context: images/jenkins
          load: true
          tags: jenkins-test:latest
          cache-from: type=gha

      - name: Test Docker Image (Smoke Test)
        run: |
          echo "Starting Jenkins container for testing..."
          docker run -d --name jenkins-test jenkins-test:latest
          
          echo "Waiting 15 seconds for Jenkins initialization..."
          sleep 15
          
          if [ "$(docker inspect -f '{{.State.Running}}' jenkins-test)" = "true" ]; then
            echo "✅ Jenkins container is running successfully!"
            
            echo "📋 Retrieving resolved plugin versions (Copy these and replace in plugins.txt):"
            docker exec jenkins-test jenkins-plugin-cli --list
            # Optional: curl -sI http://localhost:8080 | grep 403
          else
            echo "❌ Jenkins container failed to start (crash loop). Logs:"
            docker logs jenkins-test
            exit 1
          fi
          
          docker rm -f jenkins-test

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/jenkins
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max