name: CI - Package Lambda Function

on:
  push:
    paths:
      - 'aws-iam/lambda/function-source-code/**'
      - '!**/*.md'
    branches: [ "main", "master" ]
  pull_request:
    paths:
      - 'aws-iam/lambda/function-source-code/**'
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build & Package Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build deployment package
        run: |
          cd aws-iam/lambda/function-source-code
          docker run --rm \
            -v "$PWD":/var/task \
            --entrypoint /bin/bash \
            amazon/aws-lambda-python:3.12 \
            /var/task/entrypoint.sh

      - name: Verify package contents
        run: |
          ZIP=aws-iam/lambda/function-source-code/conjur-lambda-package.zip
          echo "Package contents:"
          unzip -l "$ZIP"
          unzip -l "$ZIP" | grep -q "lambda_function.py" \
            && echo "✅ lambda_function.py found" \
            || { echo "❌ lambda_function.py missing"; exit 1; }
          unzip -l "$ZIP" | grep -q "conjur_iam_client" \
            && echo "✅ conjur_iam_client found" \
            || { echo "❌ conjur_iam_client missing"; exit 1; }

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lambda-latest
          name: "Conjur Lambda Package (latest)"
          body: |
            ## Conjur Lambda Function - Deployment Package

            Ready-to-deploy ZIP for the AWS Lambda + Conjur IAM authentication demo.

            ### Download
            Click **conjur-lambda-package.zip** below ⬇️

            ### What's inside
            - `lambda_function.py` — Lambda handler
            - `conjur` SDK and dependencies
            - `conjur_iam_client` — IAM authentication client

            ---
            Built from commit ${{ github.sha }} · ${{ github.run_number }}
          files: aws-iam/lambda/function-source-code/conjur-lambda-package.zip
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
