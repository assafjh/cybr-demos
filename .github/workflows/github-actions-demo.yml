---
name: Conjur Demo - Secrets Fetch Showcase
permissions:
  id-token: write # Required for requesting the JWT from GitHub OIDC provider
  contents: read  # Required for actions/checkout
on:
  workflow_dispatch:
  
jobs:
  fetch-secret-from-conjur:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Starting CyberArk Conjur Demo
        run: |
          echo "═══════════════════════════════════════════════"
          echo "   CyberArk Conjur - GitHub Actions Demo"
          echo "═══════════════════════════════════════════════"
          echo ""

      - name: 🔐 Authenticating & Fetching Secrets from Conjur
        uses: cyberark/conjur-action@v2.0.5
        with:
          url: ${{ secrets.CONJUR_URL }}
          account: conjur
          authn_id: ${{ secrets.CONJUR_AUTHN_ID }}
          # Fetching secrets aligned with our global demo architecture
          secrets: |
            data/github/apps/safe/db_password|DB_PASSWORD
            data/github/apps/safe/api_key|API_KEY
            data/github/apps/safe/ssh_key|SSH_KEY

      - name: ✨ Displaying Retrieved Secrets (DEMO)
        shell: bash
        run: |
          echo "✅ Successfully retrieved 3 secrets from Conjur!"
          echo ""
          echo "📋 Visual representation (bypassing GitHub Actions masking for demo):"
          echo "DB_PASSWORD: $(echo $DB_PASSWORD | sed 's/./& /g')"
          echo "API_KEY:     $(echo $API_KEY | sed 's/./& /g')"
          echo "SSH_KEY:     $(echo $SSH_KEY | sed 's/./& /g')"
          echo ""
          echo "⚠️  REMINDER: This is a DEMO only. Never print real secrets in production workflows!"

      - name: 🎉 Demo Completed
        run: |
          echo "═══════════════════════════════════════════════"
          echo "   Conjur Demo Completed Successfully! 🎉"
          echo "═══════════════════════════════════════════════"