name: CI - Build & Push Push-to-File App

on:
  push:
    paths:
      - 'images/push-to-file/**'
      - '!**/*.md'
    branches: [ "main", "master" ]
  pull_request:
    paths:
      - 'images/push-to-file/**'
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/push-to-file

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Lint with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: images/push-to-file/Dockerfile
          ignore: DL3007,DL3018

  build-test-push:
    name: Build, Test & Push Multi-Arch Image
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build local image for testing
        uses: docker/build-push-action@v6
        with:
          context: images/push-to-file
          load: true
          tags: push-test:latest
          cache-from: type=gha

      - name: Smoke Test (Simulate Conjur Sidecar)
        run: |
          echo "--- Test 1: Negative Test (Expecting Timeout) ---"
          docker run --name app-test-fail push-test:latest || EXIT_CODE=$?
          if [ "$EXIT_CODE" != "1" ]; then
            echo "❌ Container should have failed with exit code 1 due to timeout, but got $EXIT_CODE"
            exit 1
          fi
          docker rm -f app-test-fail
          echo "✅ Negative test passed: Container timed out correctly."

          echo "--- Test 2: Positive Test (Simulating Sidecar Injection) ---"
          docker run -d --name app-test-success -e WAIT_TIMEOUT=30 push-test:latest
          
          sleep 2
          
          echo "[INFO] Injecting mock secrets..."
          docker exec app-test-success sh -c "mkdir -p /opt/secrets/conjur"
          docker exec app-test-success sh -c "echo 'db_pass: SecretYAML123' > /opt/secrets/conjur/credentials.yaml"
          docker exec app-test-success sh -c "echo 'db_pass=SecretPROP123' > /opt/secrets/conjur/credentials.properties"
          
          sleep 2
          
          if docker logs app-test-success | grep -q "Secrets successfully injected by Sidecar"; then
            echo "✅ Positive test passed: Container detected injected files!"
            docker logs app-test-success
          else
            echo "❌ Positive test failed: Container did not detect the files."
            docker logs app-test-success
            exit 1
          fi
          
          docker rm -f app-test-success

      - name: Build and push Multi-Arch Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: images/push-to-file
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max