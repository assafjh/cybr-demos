<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Oops! An Error Occurred</title>
    <style>
        /* Reset some default styles (optional) */
        * {
            margin: 0; 
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa; /* light gray background */
            color: #333;
            margin: 40px;
        }

        .error-container {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .error-container h1 {
            color: #d9534f; /* Bootstrap "danger" color */
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .error-details {
            margin-top: 15px;
        }

        .error-details p {
            margin: 6px 0;
            line-height: 1.4;
        }

        .error-label {
            font-weight: bold;
            color: #444;
        }

        .timestamp {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #666;
        }

        /* Responsive design: if narrower than 500px, reduce margin */
        @media (max-width: 500px) {
            body {
                margin: 10px;
            }
            .error-container {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>Oops! Something went wrong.</h1>
        <div class="error-details">
            <p><span class="error-label">Status:</span> <span th:text="${status}"></span></p>
            <p><span class="error-label">Error:</span> <span th:text="${error}"></span></p>
            <p><span class="error-label">Message:</span> <span th:text="${message}"></span></p>
            <p><span class="error-label">Path:</span> <span th:text="${path}"></span></p>
        </div>
        <div class="timestamp">
            <p><span class="error-label">Timestamp:</span> <span th:text="${timestamp}"></span></p>
        </div>
    </div>
</body>
</html>
