<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dynamic Secrets</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table {
            border-collapse: collapse; 
            width: 80%;
            margin-top: 20px;
        }
        th, td {
            padding: 8px 12px;
            border: 1px solid #ccc;
        }
        th {
            background: #f4f4f4;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Retrieved Secrets</h1>
    
    <table>
        <thead>
            <tr>
                <th>Secret Path</th>
                <th>Secret Value</th>
            </tr>
        </thead>
        <tbody>
            <!-- Loop through the Map entries and show key/value in separate cells -->
            <tr th:each="entry : ${secrets}">
                <td th:text="${entry.key}">Path Goes Here</td>
                <td th:text="${entry.value}">Value Goes Here</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
